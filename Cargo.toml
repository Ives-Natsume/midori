[workspace]
resolver = "2"
members = [
    "crates/midori-core",
    "crates/midori-source-libiio",
    "crates/midori-dsp",
    "crates/midori-sigmf",
    "crates/midori-plugin",
    "crates/midori-engine",
    "crates/midori-cli",
    "crates/midori-app",
    "plugins/midori-plugin-cw",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ives-Natsume/midori"

[workspace.dependencies]
anyhow = "1.0.100"
cpal = "0.15"
crossbeam-channel = "0.5.15"
eframe = "0.33"
egui = "0.33.3"
egui_plot = "0.34"
libiio-sys = "0.4.1"
num-complex = "0.4.6"
rustfft = "6.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

midori-core = { path = "crates/midori-core" }
midori-dsp = { path = "crates/midori-dsp" }
midori-engine = { path = "crates/midori-engine" }
midori-plugin = { path = "crates/midori-plugin" }
midori-sigmf = { path = "crates/midori-sigmf" }
midori-source-libiio = { path = "crates/midori-source-libiio" }
