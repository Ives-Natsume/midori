# Midori example configuration.
#
# Copy this file to config.toml in the workspace (or use it as a reference).
# config.toml is gitignored because it may contain local frequencies, grids,
# and TLE paths. Only the manual "Save settings" button writes it.

version = 1

[source]
kind = "pluto"
uri = "usb:"
file_path = ""
file_loop = false
center_freq_hz = 100_000_000
sample_rate_hz = 2_400_000
bandwidth_hz = 2_400_000
gain_db = 40
gain_mode = "manual"
rf_port = "A_BALANCED"
buffer_samples = 32768

[demod]
mode = "fm"

[demod.fm]
bandwidth_hz = 200_000
channel_rate_hz = 240_000
audio_rate_hz = 48_000
audio_bandwidth_hz = 15_000
deemphasis_us = 50
bfo_hz = 700

[demod.am]
bandwidth_hz = 6_000
channel_rate_hz = 48_000
audio_rate_hz = 48_000
audio_bandwidth_hz = 4_000
deemphasis_us = 0
bfo_hz = 700

[demod.cw]
bandwidth_hz = 2_000
channel_rate_hz = 240_000
audio_rate_hz = 48_000
audio_bandwidth_hz = 2_000
deemphasis_us = 0
bfo_hz = 700

[demod.sstv]
bandwidth_hz = 15_000
channel_rate_hz = 48_000
audio_rate_hz = 48_000
audio_bandwidth_hz = 3_000
deemphasis_us = 0
bfo_hz = 700

[demod.bpsk]
# 9k6 BPSK/SSDV: 30 kHz channel, 48 kHz complex output.
# Set [demod] mode = "bpsk_if" to pass a mono 48 kHz / 12 kHz real-IF
# recording through instead (the BPSK IF mode reuses these parameters).
bandwidth_hz = 30_000
channel_rate_hz = 48_000
audio_rate_hz = 48_000
audio_bandwidth_hz = 30_000
deemphasis_us = 0
bfo_hz = 700

[decoder]
cw_enabled = false
cw_afc = true
sstv_enabled = false
ssdv_enabled = false
# SSDV CRC32 initial values. The polynomial is fixed by SSDV; implementations
# differ in the initial value. Classic SSDV uses 0xFFFFFFFF; ASRTU-1/DSLWP
# uses 0x4EE4FDE1 and BY-04/JAMX uses 0x6AAAC1C5. Add the values your stream
# needs (the decoder tries each one).
ssdv_crc_inits = ["0xFFFFFFFF"]
# Bytes before the 218-byte SSDV packet in a 223-byte CCSDS frame.
ssdv_frame_header_len = 5

[ui]
spectrum_ratio = 0.55
decoder_dock_open = true
decoder_tab = "passes"
left_panel_width = 280
right_panel_width = 320
decoder_dock_height = 170
theme = "dark"
colormap = "viridis"
db_min = -110
db_max = -20
fft_size = 4096
waterfall_rows = 200
waterfall_width = 1024
waterfall_follow_spectrum = true

[satellite]
tle_path = ""
grid = "PM95"
min_elevation_deg = 5
auto_predict = false
doppler_tracking = false
